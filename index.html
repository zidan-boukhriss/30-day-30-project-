          </div>
        </header>
        <main id="main">
          <div class="name">
            <p>Zidan Boukhriss</p>
            <span>Frontend / Mobile Devoloper</span>

          <div class="about">
            <p>I build a clean, simple and functional digital experience</p>
          </div>

          <div class="place">
            <p>Morroco</p>
          </div>

          <div class="line"></div>

          <div class="skilles">
            <p>Skills</p>

            <div class="stack">
              <span>React</span>
              <span>React Native</span>
              <span>JavaScript</span>
              <span>Python</span>
            </div>

          <div class="line"></div>

          <div class="contact">
            <p style="font-weight: 500">Contact</p>
            <div class="links">
              <div class="link">
                <img src="./assets/icons8-github-60.png" alt="github" />

              </div>
              <div class="link">
                <img
                  src="./assets/icons8-instagram-96.png"

                  loading="lazy"
                />

              </div>
              <div class="link">
                <img src="./assets/icons8-x-50.png" alt="x" loading="lazy" />
