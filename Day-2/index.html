<!doctype html>
<html >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الآلة الحاسبة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <!-- شاشة العرض -->
      <div class="display">
        <div class="previous-operand" id="previous"></div>
        <div class="current-operand" id="current">0</div>
      </div>

      <!-- الأزرار -->
      <div class="buttons">
        <button class="btn-operator" id="clear">C</button>
        <button class="btn-operator" id="delete" >⌫</button>
        <button class="btn-operator" id="chnger">+-</button>
        <button class="btn-operator-ma" data-operation="/">÷</button>

        <button data-number="7" class="number">7</button>
        <button data-number="8" class="number">8</button>
        <button data-number="9" class="number">9</button>
        <button class="btn-operator-ma"    data-operation="*">×</button>

        <button data-number="4" class="number">4</button>
        <button data-number="5" class="number">5</button>
        <button data-number="6" class="number">6</button>
        <button class="btn-operator-ma" data-operation="-">−</button>

        <button data-number="1" class="number" >1</button>
        <button data-number="2" class="number">2</button>
        <button data-number="3" class="number">3</button>
        <button id="plus" class="btn-operator-ma"  data-operation="+">+</button>

        <button data-number="0"  class="span-two number">0</button>
        <button data-number="." class="number" id="dot"> .</button>
        <button id="equals" class="btn-equals" data-action="equals">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
